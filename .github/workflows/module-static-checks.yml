name: Odoo Module Checks

on:
  push:
    branches:
      - feature/ds-preparation-printing
  pull_request:
    paths:
      - "pos_posagent/**"
      - ".github/workflows/module-static-checks.yml"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python
        run: python -m compileall -q pos_posagent

      - name: Parse XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in Path("pos_posagent").rglob("*.xml"):
              ET.parse(path)
              print(f"OK {path}")
          PY

      - name: Check JavaScript syntax
        run: |
          find pos_posagent -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

  odoo-tests:
    runs-on: ubuntu-latest
    container:
      image: odoo:18.0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: posagent_test
        options: >-
          --health-cmd "pg_isready -U odoo -d posagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Odoo module tests
        run: |
          odoo             --db_host=postgres             --db_port=5432             --db_user=odoo             --db_password=odoo             --database=posagent_test             --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE             --init=pos_posagent             --without-demo=all             --test-enable             --test-tags=/pos_posagent             --stop-after-init             --log-level=test
